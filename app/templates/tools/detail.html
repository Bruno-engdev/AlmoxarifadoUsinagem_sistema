{% extends "base.html" %}
{% set active_page = "tools" %}

{% block title %}{{ tool.name }} – Almoxarifado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <a href="/tools{% if ref %}?search={{ ref|urlencode }}{% if ref_col and ref_col != 'all' %}&search_col={{ ref_col|urlencode }}{% endif %}{% endif %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Voltar
            </a>
        </div>

        {% include "tools/detail_content.html" %}
    </div>
</div>

{% include "tools/_action_modals.html" %}
{% endblock %}
