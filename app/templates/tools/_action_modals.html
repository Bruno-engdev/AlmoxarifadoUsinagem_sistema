<!-- ====== Modal Editar Ferramenta ====== -->
<div class="modal fade" id="editToolModal" tabindex="-1" aria-labelledby="editToolModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editToolModalLabel">
                    <i class="bi bi-pencil-square me-2"></i>Editar Ferramenta
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <form id="editToolForm" method="POST" action="/tools/{{ tool.id }}/edit">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="edit_name" class="form-label fw-semibold">Nome da Ferramenta *</label>
                            <input type="text" name="name" id="edit_name" class="form-control"
                                   required value="{{ tool.name }}">
                        </div>
                        <div class="col-md-3">
                            <label for="edit_origin_id" class="form-label fw-semibold">ID TOTVS</label>
                            <input type="text" name="origin_id" id="edit_origin_id" class="form-control"
                                   value="{{ tool.origin_id or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="edit_tool_type_id" class="form-label fw-semibold">Tipo de Ferramenta *</label>
                            <select name="tool_type_id" id="edit_tool_type_id" class="form-select" required>
                                {% for tt in tool_types %}
                                <option value="{{ tt.id }}" {% if tt.id == tool.tool_type_id %}selected{% endif %}>{{ tt.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="edit_description" class="form-label fw-semibold">Descrição</label>
                            <textarea name="description" id="edit_description" class="form-control"
                                      rows="2">{{ tool.description or '' }}</textarea>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_gaveta" class="form-label fw-semibold">Gaveta</label>
                            <select name="gaveta" id="edit_gaveta" class="form-select">
                                <option value="">—</option>
                                {% for g in range(1, 6) %}
                                <option value="{{ g }}" {% if tool.location and tool.location.startswith('G' ~ g|string ~ 'D') %}selected{% endif %}>Gaveta {{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="edit_divisoria" class="form-label fw-semibold">Divisória</label>
                            <select name="divisoria" id="edit_divisoria" class="form-select">
                                <option value="">—</option>
                                {% for d in range(1, 28) %}
                                <option value="{{ d }}" {% if tool.location and ('D' ~ d|string) == tool.location[tool.location.index('D'):] %}selected{% endif %}>Divisória {{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Localização</label>
                            <input type="text" id="editLocationPreview" class="form-control" readonly
                                   value="{{ tool.location or '—' }}" tabindex="-1">
                        </div>
                        <div class="col-md-4">
                            <label for="edit_min_stock" class="form-label fw-semibold">Estoque Mín.</label>
                            <input type="number" name="min_stock" id="edit_min_stock"
                                   class="form-control" min="0" value="{{ tool.min_stock }}">
                        </div>
                        <div class="col-md-4">
                            <label for="edit_max_stock" class="form-label fw-semibold">Estoque Máx.</label>
                            <input type="number" name="max_stock" id="edit_max_stock"
                                   class="form-control" min="0" value="{{ tool.max_stock }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Estoque Atual</label>
                            <input type="text" class="form-control" value="{{ tool.current_stock }}" disabled
                                   title="O saldo só é alterado por movimentações">
                        </div>
                        <div class="col-md-4">
                            <label for="edit_unit_cost" class="form-label fw-semibold">Custo Unitário (R$)</label>
                            <input type="number" name="unit_cost" id="edit_unit_cost"
                                   class="form-control" min="0" step="0.01" value="{{ tool.unit_cost or 0 }}">
                        </div>
                        <div class="col-md-4">
                            <label for="edit_avg_lifespan" class="form-label fw-semibold">Vida Útil (h)</label>
                            <input type="number" name="avg_lifespan_hours" id="edit_avg_lifespan"
                                   class="form-control" min="0" step="0.1" value="{{ tool.avg_lifespan_hours or 0 }}">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" name="is_critical" id="edit_is_critical"
                                       class="form-check-input" value="1"
                                       {% if tool.is_critical == 1 %}checked{% endif %}>
                                <label for="edit_is_critical" class="form-check-label fw-semibold">Crítica para produção</label>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Parameters -->
                    <hr class="my-3">
                    <h6><i class="bi bi-sliders me-1"></i> Parâmetros da Ferramenta</h6>
                    <div id="editParamsContainer">
                        {% for p in tool.parameters %}
                        <div class="row g-2 mb-2 param-row">
                            <div class="col-5">
                                <input type="text" name="param_name" class="form-control form-control-sm"
                                       value="{{ p.parameter_name }}">
                            </div>
                            <div class="col-5">
                                <input type="text" name="param_value" class="form-control form-control-sm"
                                       value="{{ p.parameter_value }}">
                            </div>
                            <div class="col-2">
                                <button type="button" class="btn btn-sm btn-outline-danger w-100"
                                        onclick="this.closest('.param-row').remove()">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            data-action="add-edit-param-row">
                        <i class="bi bi-plus me-1"></i> Adicionar Parâmetro
                    </button>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <button type="button" class="btn btn-outline-danger btn-sm tool-delete-trigger">
                    <i class="bi bi-trash me-1"></i>Excluir Ferramenta
                </button>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="editToolForm" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Salvar Alterações
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ====== Modal Confirmar Exclusão ====== -->
<div class="modal fade" id="deleteToolModal" tabindex="-1" aria-labelledby="deleteToolModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h6 class="modal-title" id="deleteToolModalLabel">
                    <i class="bi bi-exclamation-triangle me-1"></i>Confirmar Exclusão
                </h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p>Deseja realmente excluir/desativar a ferramenta <strong>{{ tool.name }}</strong>?</p>
                <p class="text-muted small mb-0">Se houver movimentações registradas, a ferramenta será desativada em vez de excluída.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                <form method="POST" action="/tools/{{ tool.id }}/delete" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash me-1"></i>Excluir
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    // Abre um modal-alvo, fechando antes qualquer modal Bootstrap já aberto
    // (Bootstrap 5 não suporta dois modais simultâneos no mesmo nível).
    function swapToModal(targetId) {
        var target = document.getElementById(targetId);
        if (!target) return;
        var openModalEl = document.querySelector('.modal.show');
        if (openModalEl && openModalEl !== target) {
            // Sinaliza para que o handler de cleanup do modal pai
            // não remova o modal de destino antes de exibi-lo.
            window.__swappingToModal = targetId;
            var openInst = bootstrap.Modal.getInstance(openModalEl);
            openModalEl.addEventListener('hidden.bs.modal', function onHidden() {
                openModalEl.removeEventListener('hidden.bs.modal', onHidden);
                bootstrap.Modal.getOrCreateInstance(target).show();
                window.__swappingToModal = null;
            }, { once: true });
            if (openInst) openInst.hide();
        } else {
            bootstrap.Modal.getOrCreateInstance(target).show();
        }
    }

    // Handler global delegado — funciona tanto na página detail.html standalone
    // quanto quando o partial é injetado dentro de outro modal (index.html).
    if (!window.__toolActionModalsBound) {
        window.__toolActionModalsBound = true;
        document.addEventListener('click', function (e) {
            var editBtn = e.target.closest('.tool-edit-trigger');
            if (editBtn) {
                e.preventDefault();
                swapToModal('editToolModal');
                return;
            }
            var delBtn = e.target.closest('.tool-delete-trigger');
            if (delBtn) {
                e.preventDefault();
                swapToModal('deleteToolModal');
            }
        });
    }

    // Função de init do conteúdo dinâmico do editToolModal — idempotente
    // (usa dataset.bound para não duplicar listeners).
    window.toolEditModalInit = function () {
        var addBtn = document.querySelector('#editToolModal [data-action="add-edit-param-row"]');
        var container = document.getElementById('editParamsContainer');
        var gaveta = document.getElementById('edit_gaveta');
        var divisoria = document.getElementById('edit_divisoria');
        var preview = document.getElementById('editLocationPreview');

        if (addBtn && container && !addBtn.dataset.bound) {
            addBtn.dataset.bound = '1';
            addBtn.addEventListener('click', function () {
                var row = document.createElement('div');
                row.className = 'row g-2 mb-2 param-row';
                row.innerHTML =
                    '<div class="col-5"><input type="text" name="param_name" class="form-control form-control-sm" placeholder="Nome do parâmetro"></div>' +
                    '<div class="col-5"><input type="text" name="param_value" class="form-control form-control-sm" placeholder="Valor"></div>' +
                    '<div class="col-2"><button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="this.closest(\'.param-row\').remove()"><i class="bi bi-trash"></i></button></div>';
                container.appendChild(row);
            });
        }

        function updatePreview() {
            if (!preview) return;
            var g = gaveta ? gaveta.value : '';
            var d = divisoria ? divisoria.value : '';
            preview.value = (g && d) ? 'G' + g + 'D' + d : '—';
        }
        if (gaveta && !gaveta.dataset.bound) {
            gaveta.dataset.bound = '1';
            gaveta.addEventListener('change', updatePreview);
        }
        if (divisoria && !divisoria.dataset.bound) {
            divisoria.dataset.bound = '1';
            divisoria.addEventListener('change', updatePreview);
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.toolEditModalInit);
    } else {
        window.toolEditModalInit();
    }
})();
</script>
